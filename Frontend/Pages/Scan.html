<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Domain Scanner</title>
  <link rel="stylesheet" href="../Stylesheet/Scan.css" />
</head>

<body>

  <div class="container">
    <h2>Domain Scanner</h2>

    <form id="scanForm">
      <label for="domainInput">Domain</label>
      <input type="text" id="domainInput" placeholder="Enter domain (e.g. new dex.com)" />

      <button type="submit" id="scanBtn">Scan</button>
    </form>

    <div id="error" class="error"></div>
    <div id="result" class="result"></div>
  </div>

  <script type="module" src="../Javascript/Scan.js"></script>

</body>

</html>
