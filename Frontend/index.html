<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Domain Scanner</title>
  <link rel="stylesheet" href="./Stylesheet/Scan.css" />
</head>

<body>

  <div class="container">
    <h2>Domain Scanner</h2>

    <form id="scanForm">
      <label for="domainInput">Domain</label>
      <input type="text" id="domainInput" placeholder="Enter domain (e.g. example.com)" />

      <button type="button" id="scanBtn">Scan</button>

    </form>

    <div style="margin-top: 15px; display: flex; gap: 10px;">
      <button type="button" id="recommendBtn" style="display: none;">📋 Get Recommendations</button>
      <button type="button" id="pdfBtn" style="display: none;">📄 Generate PDF Report</button>
    </div>

    <div id="error" class="error"></div>
    <div id="recommendations" class="recommendations" style="display: none;"></div>
    <div id="result" class="result"></div>
  </div>

  <script type="module" src="./Javascript/Scan.js"></script>

</body>

</html>
